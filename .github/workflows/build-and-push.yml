name: Build and push

# Builds the image natively on amd64 and arm64 runners, pushes each platform
# by digest, then publishes the multi-arch manifest to Docker Hub as
# <version>, stable and latest.
#
# Every build starts from scratch so that each image ships the latest Ubuntu
# security updates. The weekly schedule refreshes the current version even
# when Flutter has not moved.

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - FLUTTER_VERSION
      - .github/workflows/build-and-push.yml
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit to build
        required: true
        type: string

permissions:
  contents: read

env:
  IMAGE: docker.io/kwop/flutter
  DOCKERHUB_USERNAME: kwop

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Read FLUTTER_VERSION
        id: version
        run: |
          version=$(tr -d '[:space:]' <FLUTTER_VERSION)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid FLUTTER_VERSION: '$version'"
            exit 1
          fi
          echo "Flutter $version"
          echo "version=$version" >>"$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Free disk space
        # The image is several GB uncompressed; drop preinstalled SDKs the
        # build does not use.
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          build-args: flutter_version=${{ needs.prepare.outputs.version }}
          pull: true
          no-cache: true
          provenance: mode=max
          sbom: true
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    steps:
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and push manifest list
        working-directory: ${{ runner.temp }}/digests
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          sources=()
          for digest in *; do
            sources+=("${IMAGE}@sha256:${digest}")
          done
          docker buildx imagetools create \
            --tag "${IMAGE}:${VERSION}" \
            --tag "${IMAGE}:stable" \
            --tag "${IMAGE}:latest" \
            "${sources[@]}"

      - name: Inspect image
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: docker buildx imagetools inspect "${IMAGE}:${VERSION}"
